name: Weekly retrain

# Runs on GitHub's free-tier runners (2,000 min/month free on private repos,
# unlimited on public repos) -- no server, no AWS/Azure/GCP bill for this part.
on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday at 06:00 UTC
  workflow_dispatch: {}     # allow manual "Run workflow" trigger too

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r training/requirements.txt

      - name: Retrain and export risk scores
        run: |
          cd training
          python train_churn_model.py \
            --data Telco-Customer-Churn.csv \
            --out ../data/risk_scores.csv \
            --metrics_out ../data/model_metrics.json

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/risk_scores.csv data/model_metrics.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Weekly retrain: refresh risk scores"
          git push
        # Pushing to main triggers Vercel's Git integration to auto-deploy
        # with the new data -- no separate deploy step needed here.
